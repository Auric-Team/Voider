[package]
name = "voider-core"
version = "0.1.0"
edition = "2024"
authors = ["Auric Team"]
description = "High-performance binary analysis, disassembly, and CFG engine for Voider"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
goblin = { version = "0.9", features = ["elf32", "elf64", "pe32", "pe64", "mach32", "mach64", "archive"] }
iced-x86 = { version = "1.21", features = ["code_asm", "decoder", "gas", "intel", "masm", "nasm", "fast_fmt"] }

[dev-dependencies]
